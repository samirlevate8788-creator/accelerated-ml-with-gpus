name: ML Pipeline & Code Quality

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    - name: Syntax & Lint Check
      run: |
        python -m py_compile pipeline.py benchmark.py profiling_demo.py
    - name: Test Profiling Logic
      run: |
        python profiling_demo.py
